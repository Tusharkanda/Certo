# Milestone mode on a local model, second run (Certo 0.1.27): qwen3.8 on
# app-tasks/spreadsheet with a 65,536-token window instead of 32,768, and
# 40 minutes for each milestone instead of 20. The whole task in one go
# keeps its 100 minutes. Run it from the repository root with:
#   certo bench --config docs/benchmark/bench-0.1.27-milestones-local-64k.yaml
# Every model below must be enabled in your models.yaml; see
# docs/guides/write-a-benchmark-file.md.
tasks_dir: app-tasks
tasks: [spreadsheet]
repeats: 3
arms:
  - {name: qwen-whole-64k, strategy: single, model: qwen3.8-27b-local, context_tokens: 65536, max_task_seconds: 6000}
  - {name: qwen-milestones-64k, strategy: single, model: qwen3.8-27b-local, context_tokens: 65536, max_task_seconds: 2400, milestones: true}
