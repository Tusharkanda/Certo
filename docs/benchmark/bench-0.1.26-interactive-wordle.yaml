# The testable-interactive-apps skill on the one bundled task it fires on
# (wordle-score, "game"), Certo 0.1.26: claude-haiku-5-5 with the skill
# and without it (skills_off). Run it with:
#   certo bench --config docs/benchmark/bench-0.1.26-interactive-wordle.yaml
# Every model below must be enabled in your models.yaml; see
# docs/guides/write-a-benchmark-file.md.
tasks: [wordle-score]
repeats: 3
arms:
  - {name: haiku-no-skill, strategy: single, model: claude-haiku-5-5, skills_off: [testable-interactive-apps]}
  - {name: haiku-skill, strategy: single, model: claude-haiku-5-5}
