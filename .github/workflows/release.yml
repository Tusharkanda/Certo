name: release

# Publishes to PyPI via trusted publishing (no API token anywhere) when a
# `v*` tag is pushed. A PyPI version number can never be reused, so nothing is
# built until the tag matches pyproject.toml and the full test suite passes,
# and nothing is published unless the built wheel passes
# scripts/release_check.sh once installed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Every action runs on Node.js 24. setup-uv publishes no major tags any more,
# so it is pinned to an exact release. ci.yml runs the same checks on
# ubuntu-latest for every push to main, so a runner image change shows up
# there before a release.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Tag must match pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "tag: ${GITHUB_REF_NAME}  pyproject.toml: ${project_version}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${project_version}"
            exit 1
          fi
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (no API key)
        run: uv run pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      # Installs exactly this wheel with `uv tool install`, the way users do,
      # and runs `certo verify` on fixture projects from an empty directory.
      # Catches "works in the dev venv only" bugs before anything is published.
      - name: Release check (installed wheel, no LLM)
        run: scripts/release_check.sh --wheel dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub Release page, after PyPI succeeds: its text is
  # docs/launch/release-notes-v<version>.md without the title, with
  # `../` links pointing at the files at this tag. A missing notes file
  # fails the job; a Release made by hand for this tag is left alone.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/launch/release-notes-v${version}.md"
          if [ ! -f "${notes}" ]; then
            echo "::error::${notes} is missing: no GitHub Release text"
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "A Release for ${GITHUB_REF_NAME} already exists; leaving it."
            exit 0
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs"
          tail -n +3 "${notes}" | sed -E "s#\]\(\.\./([^)]*)\)#](${base}/\1)#g" > body.md
          gh release create "${GITHUB_REF_NAME}" --title "Certo ${version}" \
            --notes-file body.md --verify-tag --latest
